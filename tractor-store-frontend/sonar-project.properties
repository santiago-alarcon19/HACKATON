# SonarCloud — create project at https://sonarcloud.io (key must match organization)
sonar.projectKey=santiago-alarcon19_tractor-store-frontend
sonar.organization=santiago-alarcon19

sonar.projectName=Tractor Store Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages,tools
sonar.tests=apps,packages
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.nx/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/jest.config.ts,**/webpack*.js,**/environment*.ts

# Align Sonar coverage with Jest collectCoverageFrom (shell/tools have no unit LCOV)
sonar.coverage.exclusions=**/apps/**,**/tools/**,**/bootstrap.ts,**/main.ts,**/elements.ts,**/*-app.config.ts,**/*-root.component.ts,**/remote-entry/**,**/explore-layout.component.ts,**/environment*.ts,**/index.ts,**/*.d.ts,**/test-setup.ts,**/jest.config.ts

# LCOV from: pnpm test:coverage (Nx writes under coverage/<project>/)
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
sonar.typescript.lcov.reportPaths=coverage/**/lcov.info

# Falla el pipeline si el Quality Gate de SonarCloud no pasa (p. ej. cobertura < 80%)
sonar.qualitygate.wait=true

