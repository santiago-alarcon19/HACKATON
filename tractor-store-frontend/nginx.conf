# Resolver de Docker: evita fallo "host not found in upstream" si api aún no existe al arrancar nginx
resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html/shell;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /mfe-explore/ {
    alias /usr/share/nginx/html/mfe-explore/;
    try_files $uri $uri/ /mfe-explore/index.html;
  }

  location /mfe-decide/ {
    alias /usr/share/nginx/html/mfe-decide/;
    try_files $uri $uri/ /mfe-decide/index.html;
  }

  location /mfe-checkout/ {
    alias /usr/share/nginx/html/mfe-checkout/;
    try_files $uri $uri/ /mfe-checkout/index.html;
  }

  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /swagger-ui/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;
  }

  location /v3/api-docs {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;
  }

  gzip on;
  gzip_types text/plain application/javascript text/css application/json;
}
