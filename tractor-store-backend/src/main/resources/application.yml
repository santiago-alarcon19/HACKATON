spring:
  application:
    name: tractor-store-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tractorstore}
    username: ${DATABASE_USERNAME:tractor}
    password: ${DATABASE_PASSWORD:tractor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

tractor:
  cart:
    cookie-name: TRACTOR_CART_SESSION
    cookie-max-age-days: 7

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.tractorstore: INFO
