# SonarCloud — create project at https://sonarcloud.io (key must match organization)
sonar.projectKey=santiago-alarcon19_tractor-store-backend
sonar.organization=santiago-alarcon19

sonar.projectName=Tractor Store Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=21
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

sonar.exclusions=**/target/**,**/generated/**

# Align Sonar coverage with JaCoCo gate (DTOs, entities, repos are thin boilerplate)
sonar.coverage.exclusions=**/dto/**,**/domain/**,**/repository/**,**/package-info.java,**/config/**,**/*Application.java,**/events/**

# Falla el pipeline si el Quality Gate de SonarCloud no pasa (p. ej. cobertura < 80%)
sonar.qualitygate.wait=true
