# CI — build, tests y smoke end-to-end (path filters por stack)
name: Tractor Store — CI (build, tests y smoke)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: 'Paso 1 · Detectar qué partes del monorepo cambiaron'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Clonar repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar filtros de rutas (backend / frontend / shared)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'tractor-store-backend/**'
            frontend:
              - 'tractor-store-frontend/**'
            shared:
              - 'docker-compose.yml'
              - 'DEPLOYMENT.md'
              - 'README.md'
              - '.gitignore'
              - 'database.json'
              - 'database-index.js'
              - 'products-blueprint.js'
              - 'blueprint-tree.json'
              - 'stores-page.js'
              - 'store-component.js'
              - 'search.json'
              - 'guia-extracted.txt'
              - '.github/**'

  backend:
    name: 'Paso 2a · Backend Spring Boot — Maven verify + JaCoCo'
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tractor-store-backend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin + caché Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tractor-store-backend/pom.xml

      - name: Ejecutar tests de integración y unitarios (mvn verify)
        run: mvn -B verify -DskipTests=false

      - name: Publicar reporte JaCoCo (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: tractor-store-backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: 'Paso 2b · Frontend Angular Nx — lint, tests, cobertura y build'
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tractor-store-frontend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activar pnpm 9.15
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Lint ESLint (no bloqueante)
        run: pnpm lint
        continue-on-error: true

      - name: Tests unitarios con cobertura LCOV (shared-catalog + design-system)
        run: |
          pnpm exec nx test shared-catalog --coverage --coverageReporters=lcov
          pnpm exec nx test ts-design-system --coverage --coverageReporters=lcov

      - name: Build de producción (shell + 3 MFEs)
        run: |
          pnpm exec nx build shell --configuration=production
          pnpm exec nx build mfe-explore --configuration=production
          pnpm exec nx build mfe-decide --configuration=production
          pnpm exec nx build mfe-checkout --configuration=production

      - name: Publicar cobertura frontend (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: tractor-store-frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  docker-compose-smoke:
    name: 'Paso 3 · Smoke E2E — docker compose (API + frontend)'
    needs: [detect-changes, backend, frontend]
    if: >
      always() &&
      !cancelled() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (
        needs.detect-changes.outputs.shared == 'true' ||
        (
          needs.detect-changes.outputs.backend == 'true' &&
          needs.detect-changes.outputs.frontend == 'true'
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Levantar stack completo (PostgreSQL + API + frontend)
        run: docker compose up --build -d

      - name: Esperar health check de la API (GET /api/catalog/home)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/catalog/home > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          docker compose logs api
          exit 1

      - name: Esperar frontend accesible (GET /)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/ > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend did not become healthy in time"
          docker compose logs frontend
          exit 1

      - name: Detener contenedores y limpiar volúmenes
        if: always()
        run: docker compose down -v
