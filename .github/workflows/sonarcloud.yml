# SonarCloud — análisis de calidad y cobertura (Quality Gate ≥ 80%)
name: Tractor Store — SonarCloud (calidad y cobertura)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  detect-changes:
    name: 'Paso 1 · Detectar qué partes del monorepo cambiaron'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Clonar repositorio (historial completo para blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar filtros de rutas (backend / frontend / shared)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'tractor-store-backend/**'
            frontend:
              - 'tractor-store-frontend/**'
            shared:
              - 'docker-compose.yml'
              - 'DEPLOYMENT.md'
              - 'README.md'
              - '.gitignore'
              - 'database.json'
              - 'database-index.js'
              - 'products-blueprint.js'
              - 'blueprint-tree.json'
              - 'stores-page.js'
              - 'store-component.js'
              - 'search.json'
              - 'guia-extracted.txt'
              - '.github/**'

  sonar-backend:
    name: 'Paso 2a · SonarCloud backend Java — cobertura JaCoCo (mín. 80%)'
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tractor-store-backend

    steps:
      - name: Clonar repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 (Temurin + caché Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tractor-store-backend/pom.xml

      - name: Ejecutar tests con cobertura (mvn verify → JaCoCo)
        run: mvn -B verify

      - name: Enviar análisis a SonarCloud y esperar Quality Gate
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: tractor-store-backend
          args: >
            -Dsonar.qualitygate.wait=true

  sonar-frontend:
    name: 'Paso 2b · SonarCloud frontend TS — cobertura LCOV (mín. 80%)'
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tractor-store-frontend

    steps:
      - name: Clonar repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activar pnpm 9.15
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Tests unitarios con cobertura LCOV (shared-catalog + design-system)
        run: |
          pnpm exec nx test shared-catalog --coverage --coverageReporters=lcov
          pnpm exec nx test ts-design-system --coverage --coverageReporters=lcov

      - name: Enviar análisis a SonarCloud y esperar Quality Gate
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: tractor-store-frontend
          args: >
            -Dsonar.qualitygate.wait=true
