# SonarCloud — solo el stack que cambió (path filters)
name: SonarCloud

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'tractor-store-backend/**'
            frontend:
              - 'tractor-store-frontend/**'
            shared:
              - 'docker-compose.yml'
              - 'DEPLOYMENT.md'
              - 'README.md'
              - '.gitignore'
              - 'database.json'
              - 'database-index.js'
              - 'products-blueprint.js'
              - 'blueprint-tree.json'
              - 'stores-page.js'
              - 'store-component.js'
              - 'search.json'
              - 'guia-extracted.txt'
              - '.github/**'

  sonar-backend:
    name: Sonar — Backend
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tractor-store-backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test with coverage
        run: mvn -B verify

      - name: SonarCloud Scan (backend)
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: tractor-store-backend

  sonar-frontend:
    name: Sonar — Frontend
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tractor-store-frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests with coverage
        run: |
          pnpm exec nx test shared-catalog --coverage --coverageReporters=lcov
          pnpm exec nx test ts-design-system --coverage --coverageReporters=lcov

      - name: SonarCloud Scan (frontend)
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: tractor-store-frontend
