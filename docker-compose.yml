# Tractor Store — stack completo (Sesiones 1 y 2)
# Uso: docker compose down && docker compose up --build
# Frontend: http://localhost
# API (host): http://localhost:8081  (8081 evita conflicto si 8080 está ocupado)
# Swagger: http://localhost/swagger-ui/index.html

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tractorstore
      POSTGRES_USER: tractor
      POSTGRES_PASSWORD: tractor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tractor -d tractorstore"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./tractor-store-backend
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tractorstore
      DATABASE_USERNAME: tractor
      DATABASE_PASSWORD: tractor
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/catalog/home || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: ./tractor-store-frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
